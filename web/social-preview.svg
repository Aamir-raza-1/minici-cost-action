<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="MiniCI OpenGraph Social Preview">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="60%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#071518"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="36" y="36" width="1208" height="568" rx="28" fill="none" stroke="#1E293B" stroke-width="2"/>
  <rect x="36" y="598" width="1208" height="6" rx="3" fill="url(#accent)"/>

  <!-- Brand Icon Left -->
  <g transform="translate(88, 128) scale(0.42)">
    <rect x="16" y="16" width="480" height="480" rx="108" fill="#0B1120" stroke="url(#iconBorder)" stroke-width="12"/>
    <line x1="128" y1="156" x2="128" y2="356" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
    <circle cx="128" cy="156" r="20" fill="#10B981"/>
    <circle cx="128" cy="256" r="20" fill="#38BDF8"/>
    <circle cx="128" cy="356" r="20" fill="#10B981"/>
    <rect x="174" y="138" width="212" height="36" rx="18" fill="#1E293B"/>
    <rect x="174" y="138" width="154" height="36" rx="18" fill="#38BDF8"/>
    <rect x="174" y="238" width="212" height="36" rx="18" fill="#1E293B"/>
    <rect x="174" y="238" width="116" height="36" rx="18" fill="#10B981"/>
    <rect x="174" y="338" width="118" height="36" rx="18" fill="#10B981"/>
    <circle cx="358" cy="356" r="56" fill="#06281E" stroke="#10B981" stroke-width="8"/>
    <line x1="358" y1="318" x2="358" y2="394" stroke="#34D399" stroke-width="9" stroke-linecap="round"/>
    <path d="M 376 336 C 376 325, 340 325, 340 340 C 340 353, 378 353, 378 369 C 378 385, 340 385, 340 373" fill="none" stroke="#ECFDF5" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Title & Tagline -->
  <text x="336" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="76" font-weight="800" fill="#F8FAFC" letter-spacing="-2">MiniCI</text>
  <rect x="590" y="160" width="248" height="44" rx="22" fill="#06281E" stroke="#10B981" stroke-width="1.5"/>
  <text x="714" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#34D399">Rust std-only • &lt;2ms</text>

  <text x="336" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="31" font-weight="600" fill="#CBD5E1">CI/CD Cost Breakdown, PR Matrix Diff &amp; FinOps Optimizer</text>
  <text x="336" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="22" fill="#94A3B8">GitHub Actions • GitLab CI • CircleCI • Bitbucket • CodeBuild • Cloud Build • Azure</text>

  <!-- Terminal Receipt Preview Box -->
  <rect x="88" y="378" width="1104" height="174" rx="16" fill="#090E17" stroke="#1E293B" stroke-width="2"/>
  <circle cx="118" cy="406" r="6" fill="#EF4444"/>
  <circle cx="138" cy="406" r="6" fill="#F59E0B"/>
  <circle cx="158" cy="406" r="6" fill="#10B981"/>
  <text x="184" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#64748B">minici diff --path . --compare-to origin/main</text>

  <text x="116" y="456" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#38BDF8">$ minici breakdown --path .   |   minici shrink --path . --apply   |   minici mcp</text>
  <text x="116" y="494" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#34D399">✓ 7 CI Vendors • 225+ Cloud &amp; Runner SKUs • 8-Tool MCP Server • Zero Source-Code Access</text>
  <text x="116" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#94A3B8">github.com/Aamir-raza-1/minici-cost-action</text>
