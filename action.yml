name: "MiniCI — CI/CD Cost Breakdown, PR Diff & Quota Receipt"
description: "Sub-millisecond Rust engine for CI/CD matrix cost breakdowns, PR diffs, free-tier quota burn, and wait-time cost."
author: "Aamir Raza <raza.aamir01@gmail.com>"
branding:
  icon: "dollar-sign"
  color: "green"

inputs:
  path:
    description: "Path to repository root or workflow directory"
    required: false
    default: "."
  compare-to:
    description: "Optional base Git ref (e.g. origin/main) to also render a Pull Request cost delta table"
    required: false
    default: ""
  tier:
    description: "Pricing tier mode: auto, free, or paid"
    required: false
    default: "auto"
  prs-per-week:
    description: "Pull requests per week for monthly run-rate projection"
    required: false
    default: "25"
  pushes-per-pr:
    description: "Average pushes per pull request"
    required: false
    default: "4"
  dev-hourly-rate:
    description: "Developer hourly engineering rate (USD) for wait-time cost calculation"
    required: false
    default: "65"
  live-telemetry:
    description: "Sync live GitHub Actions workflow run/job telemetry (ETag 304 cached) before computing breakdown"
    required: false
    default: "false"
  billing-csv:
    description: "Optional path to GitHub, CircleCI, GitLab, or FOCUS v1.1 billing CSV for 100% invoice reconciliation"
    required: false
    default: ""
  post-pr-comment:
    description: "Automatically post or update a sticky Pull Request CI cost diff comment when running on pull_request"
    required: false
    default: "false"

outputs:
  gross_monthly_compute_cost_usd:
    description: "Gross monthly CI/CD compute cost (USD)"
    value: ${{ steps.minici.outputs.gross_monthly_compute_cost_usd }}
  net_billed_monthly_compute_cost_usd:
    description: "Net billed monthly CI/CD compute cost after free-tier allowance (USD)"
    value: ${{ steps.minici.outputs.net_billed_monthly_compute_cost_usd }}
  monthly_rounding_tax_usd:
    description: "Monthly sub-minute ceiling rounding overhead (USD)"
    value: ${{ steps.minici.outputs.monthly_rounding_tax_usd }}
  recommended_ec2_instance:
    description: "Right-sized self-hosted cloud compute instance equivalent"
    value: ${{ steps.minici.outputs.recommended_ec2_instance }}
  artifact_storage_90d_usd:
    description: "Monthly 90-day artifact storage cost (USD)"
    value: ${{ steps.minici.outputs.artifact_storage_90d_usd }}
  parallelism_tier_upgrade_tax_usd:
    description: "Monthly concurrency cap seat-tier upgrade tax (USD)"
    value: ${{ steps.minici.outputs.parallelism_tier_upgrade_tax_usd }}
  external_log_shipping_90d_usd:
    description: "Monthly 90-day external SIEM / log shipping cost (USD)"
    value: ${{ steps.minici.outputs.external_log_shipping_90d_usd }}
  nat_egress_worst_case_usd:
    description: "Monthly private-subnet NAT Gateway + Internet Egress benchmark cost (USD)"
    value: ${{ steps.minici.outputs.nat_egress_worst_case_usd }}
  monthly_productive_payroll_loss_usd:
    description: "Monthly developer wait-time payroll loss at 40% context-switch loss factor (USD)"
    value: ${{ steps.minici.outputs.monthly_productive_payroll_loss_usd }}
  monthly_total_immediate_flake_cost_usd:
    description: "Monthly immediate flaky build rerun compute + 8-minute engineer investigation cost (USD)"
    value: ${{ steps.minici.outputs.monthly_total_immediate_flake_cost_usd }}
  monthly_unrealized_cache_savings_usd:
    description: "Monthly unrealized dependency and build cache savings across uncached jobs (USD)"
    value: ${{ steps.minici.outputs.monthly_unrealized_cache_savings_usd }}
  monthly_combined_flake_tax_usd:
    description: "Monthly combined flaky test velocity tax including 2x deferred velocity drag (USD)"
    value: ${{ steps.minici.outputs.monthly_combined_flake_tax_usd }}
  monthly_superseded_run_waste_usd:
    description: "Monthly superseded PR push compute waste from workflows missing cancel-in-progress (USD)"
    value: ${{ steps.minici.outputs.monthly_superseded_run_waste_usd }}
  monthly_unfiltered_check_savings_usd:
    description: "Monthly selective check savings from workflows missing path filters (USD)"
    value: ${{ steps.minici.outputs.monthly_unfiltered_check_savings_usd }}
  inferred_team_stage:
    description: "Dynamically inferred team stage from monthly CI volume and compute spend"
    value: ${{ steps.minici.outputs.inferred_team_stage }}
  detected_pipeline_shape:
    description: "Dynamically detected pipeline architecture shape (single-service, monorepo, multi-service-microservices)"
    value: ${{ steps.minici.outputs.detected_pipeline_shape }}
  detected_workspace_units_count:
    description: "Number of workspace or service units discovered in manifests and workflows"
    value: ${{ steps.minici.outputs.detected_workspace_units_count }}
  monthly_affected_only_savings_usd:
    description: "Monthly savings from adopting affected-only dependency graph execution on monorepos (USD)"
    value: ${{ steps.minici.outputs.monthly_affected_only_savings_usd }}
  recoverable_ci_and_wait_monthly_usd:
    description: "Total monthly recoverable CI compute and developer wait-time waste for Platform Engineer ROI (USD)"
    value: ${{ steps.minici.outputs.recoverable_ci_and_wait_monthly_usd }}
  monthly_shared_infra_setup_savings_usd:
    description: "Monthly per-job setup overhead savings from shared base images and pre-warmed caches (USD)"
    value: ${{ steps.minici.outputs.monthly_shared_infra_setup_savings_usd }}
  cheapest_vendor_platform:
    description: "Lowest monthly TCO CI/CD platform across the 9-vendor comparison engine"
    value: ${{ steps.minici.outputs.cheapest_vendor_platform }}
  cheapest_vendor_monthly_tco_usd:
    description: "Monthly TCO on the lowest-cost CI/CD platform including seats and overage (USD)"
    value: ${{ steps.minici.outputs.cheapest_vendor_monthly_tco_usd }}
  migration_worth_it_2x_annual_rule:
    description: "Whether annual CI TCO savings exceed 2x the estimated engineering migration cost"
    value: ${{ steps.minici.outputs.migration_worth_it_2x_annual_rule }}
  best_first_optimization_phase:
    description: "Highest-ROI build phase to optimize first based on effort vs monthly savings payback"
    value: ${{ steps.minici.outputs.best_first_optimization_phase }}
  monthly_total_reducible_phase_savings_usd:
    description: "Total monthly reducible compute waste across all 6 build phases (USD)"
    value: ${{ steps.minici.outputs.monthly_total_reducible_phase_savings_usd }}
  detected_workload_compute_profile:
    description: "Detected Amdahl compute scaling profile (compile-heavy, test-heavy, balanced-web-backend, io-bound)"
    value: ${{ steps.minici.outputs.detected_workload_compute_profile }}
  arm64_migration_monthly_savings_usd:
    description: "Monthly compute savings from migrating eligible Linux x64 jobs to ARM64 runners (USD)"
    value: ${{ steps.minici.outputs.arm64_migration_monthly_savings_usd }}
  detected_stack_archetype:
    description: "Detected language and build-tool stack archetype from repository manifests and workflow AST"
    value: ${{ steps.minici.outputs.detected_stack_archetype }}
  stack_specific_monthly_savings_usd:
    description: "Monthly savings from applying the primary stack-native CI optimization lever (USD)"
    value: ${{ steps.minici.outputs.stack_specific_monthly_savings_usd }}
  cost_per_merged_pr_usd:
    description: "Unit economics CI compute cost per merged Pull Request (USD)"
    value: ${{ steps.minici.outputs.cost_per_merged_pr_usd }}
  projected_eom_compute_usd:
    description: "Projected end-of-month CI compute spend weighted by 7d vs 30d burn velocity (USD)"
    value: ${{ steps.minici.outputs.projected_eom_compute_usd }}
  jobs_missing_timeout_minutes_count:
    description: "Count of defined CI jobs missing an explicit timeout-minutes guardrail"
    value: ${{ steps.minici.outputs.jobs_missing_timeout_minutes_count }}

runs:
  using: "composite"
  steps:
    - name: Run MiniCI Sub-Millisecond Rust CI/CD Cost Breakdown & PR Diff
      id: minici
      shell: bash
      run: |
        BIN_PATH="${{ github.action_path }}/target/release/minici"
        if ! "$BIN_PATH" --version >/dev/null 2>&1; then
          mkdir -p "${{ github.action_path }}/target/release"
          OS_RAW="$(uname -s)"
          ARCH_RAW="$(uname -m)"
          ASSET=""
          if [ "$OS_RAW" = "Linux" ] && [ "$ARCH_RAW" = "x86_64" ]; then ASSET="minici-linux-x86_64"; fi
          if [ "$OS_RAW" = "Linux" ] && { [ "$ARCH_RAW" = "aarch64" ] || [ "$ARCH_RAW" = "arm64" ]; }; then ASSET="minici-linux-aarch64"; fi
          if [ "$OS_RAW" = "Darwin" ] && [ "$ARCH_RAW" = "arm64" ]; then ASSET="minici-macos-aarch64"; fi
          if [ "$OS_RAW" = "Darwin" ] && [ "$ARCH_RAW" = "x86_64" ]; then ASSET="minici-macos-x86_64"; fi
          if [ -n "$ASSET" ] && curl -fsSL "https://github.com/Aamir-raza-1/minici-cost-action/releases/latest/download/${ASSET}" -o "$BIN_PATH" 2>/dev/null; then
            chmod +x "$BIN_PATH"
          fi
        fi
        if ! "$BIN_PATH" --version >/dev/null 2>&1; then
          cargo build --release --manifest-path "${{ github.action_path }}/crates/minici/Cargo.toml"
          mkdir -p "${{ github.action_path }}/target/release"
          cp "${{ github.action_path }}/crates/minici/target/release/minici" "$BIN_PATH"
        fi
        EXTRA_BD_ARGS=()
        if [ "${{ inputs.live-telemetry }}" = "true" ]; then
          EXTRA_BD_ARGS+=(--live)
        fi
        if [ -n "${{ inputs.billing-csv }}" ]; then
          EXTRA_BD_ARGS+=(--billing-csv "${{ inputs.billing-csv }}")
        fi
        "$BIN_PATH" breakdown \
          --path "${{ inputs.path }}" \
          --tier "${{ inputs.tier }}" \
          --prs-per-week "${{ inputs.prs-per-week }}" \
          --pushes-per-pr "${{ inputs.pushes-per-pr }}" \
          --dev-hourly-rate "${{ inputs.dev-hourly-rate }}" \
          "${EXTRA_BD_ARGS[@]}" \
          --format table
        "$BIN_PATH" breakdown \
          --path "${{ inputs.path }}" \
          --tier "${{ inputs.tier }}" \
          --prs-per-week "${{ inputs.prs-per-week }}" \
          --pushes-per-pr "${{ inputs.pushes-per-pr }}" \
          --dev-hourly-rate "${{ inputs.dev-hourly-rate }}" \
          "${EXTRA_BD_ARGS[@]}" \
          --format markdown \
          --out-file .minici_breakdown.md \
          --quiet
        if [ -n "${{ inputs.compare-to }}" ]; then
          "$BIN_PATH" diff \
            --path "${{ inputs.path }}" \
            --compare-to "${{ inputs.compare-to }}" \
            --format table
          "$BIN_PATH" diff \
            --path "${{ inputs.path }}" \
            --compare-to "${{ inputs.compare-to }}" \
            --format markdown \
            --out-file .minici_diff.md \
            --quiet
          if [ "${{ inputs.post-pr-comment }}" = "true" ] && [ -n "${GITHUB_EVENT_PATH:-}" ]; then
            "$BIN_PATH" comment github \
              --path "${{ inputs.path }}" \
              --compare-to "${{ inputs.compare-to }}" \
              --event-path "$GITHUB_EVENT_PATH" \
              --behavior update \
              --post \
              --quiet || true
          fi
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f .minici_diff.md ]; then
            cat .minici_diff.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f .minici_breakdown.md ]; then
          cat .minici_breakdown.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          "$BIN_PATH" breakdown \
            --path "${{ inputs.path }}" \
            --tier "${{ inputs.tier }}" \
            --prs-per-week "${{ inputs.prs-per-week }}" \
            --pushes-per-pr "${{ inputs.pushes-per-pr }}" \
            --dev-hourly-rate "${{ inputs.dev-hourly-rate }}" \
            "${EXTRA_BD_ARGS[@]}" \
            --format json \
            --out-file .minici_breakdown.json \
            --quiet
          python3 -c '
        import json, os
        d = json.load(open(".minici_breakdown.json"))
        cc = d.get("cost_components", {})
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            wf = lambda k, v: f.write(f"{k}={float(v):.2f}\n")
            ws = lambda k, v: f.write(f"{k}={v}\n")
            wf("gross_monthly_compute_cost_usd", d.get("gross_monthly_compute_cost_usd", 0.0))
            wf("net_billed_monthly_compute_cost_usd", d.get("net_billed_monthly_compute_cost_usd", 0.0))
            wf("monthly_rounding_tax_usd", cc.get("build_minutes_cost", {}).get("monthly_rounding_tax_usd", 0.0))
            ws("recommended_ec2_instance", cc.get("runner_cost", {}).get("infracost_recommended_ec2_instance", ""))
            wf("artifact_storage_90d_usd", cc.get("artifact_storage_cost", {}).get("monthly_vendor_storage_90d_usd", 0.0))
            wf("parallelism_tier_upgrade_tax_usd", cc.get("parallelism_cost", {}).get("parallelism_tier_upgrade_tax_monthly_usd", 0.0))
            wf("external_log_shipping_90d_usd", cc.get("log_retention_cost", {}).get("monthly_datadog_90d_log_shipping_usd", 0.0))
            wf("nat_egress_worst_case_usd", cc.get("cross_region_egress_cost", {}).get("monthly_infracost_private_subnet_nat_worst_case_usd", 0.0))
            wf("monthly_productive_payroll_loss_usd", cc.get("developer_wait_time_cost", {}).get("monthly_productive_payroll_loss_usd", 0.0))
            wf("monthly_total_immediate_flake_cost_usd", cc.get("failed_build_rerun_cost", {}).get("monthly_total_immediate_flake_cost_usd", 0.0))
            wf("monthly_unrealized_cache_savings_usd", cc.get("build_cache_savings", {}).get("monthly_unrealized_cache_savings_usd", 0.0))
            wf("monthly_combined_flake_tax_usd", cc.get("flaky_test_ci_cd_tax", {}).get("monthly_combined_flake_tax_usd", 0.0))
            wf("monthly_superseded_run_waste_usd", cc.get("branch_protection_cost", {}).get("monthly_superseded_run_waste_usd", 0.0))
            wf("monthly_unfiltered_check_savings_usd", cc.get("branch_protection_cost", {}).get("monthly_unfiltered_check_savings_usd", 0.0))
            ws("inferred_team_stage", cc.get("startup_stage_cost", {}).get("inferred_team_stage", ""))
            ws("detected_pipeline_shape", cc.get("monorepo_ci_cost", {}).get("detected_pipeline_shape", ""))
            ws("detected_workspace_units_count", cc.get("monorepo_ci_cost", {}).get("detected_workspace_units_count", 0))
            wf("monthly_affected_only_savings_usd", cc.get("monorepo_ci_cost", {}).get("monthly_affected_only_savings_usd", 0.0))
            wf("recoverable_ci_and_wait_monthly_usd", cc.get("scaleup_stage_cost", {}).get("recoverable_ci_and_wait_monthly_usd", 0.0))
            wf("monthly_shared_infra_setup_savings_usd", cc.get("microservices_ci_cost", {}).get("monthly_shared_infra_setup_savings_usd", 0.0))
            ws("cheapest_vendor_platform", cc.get("vendor_tco_comparison", {}).get("cheapest_vendor_platform", ""))
            wf("cheapest_vendor_monthly_tco_usd", cc.get("vendor_tco_comparison", {}).get("cheapest_vendor_monthly_tco_usd", 0.0))
            ws("migration_worth_it_2x_annual_rule", str(cc.get("vendor_tco_comparison", {}).get("migration_worth_it_2x_annual_rule", False)).lower())
            ws("best_first_optimization_phase", cc.get("build_phase_breakdown", {}).get("best_first_optimization_phase", ""))
            wf("monthly_total_reducible_phase_savings_usd", cc.get("build_phase_breakdown", {}).get("monthly_total_reducible_phase_savings_usd", 0.0))
            ws("detected_workload_compute_profile", cc.get("compute_class_explorer", {}).get("detected_workload_compute_profile", ""))
            wf("arm64_migration_monthly_savings_usd", cc.get("compute_class_explorer", {}).get("arm64_migration_monthly_savings_usd", 0.0))
            ws("detected_stack_archetype", cc.get("stack_specific_economics", {}).get("detected_stack_archetype", ""))
            wf("stack_specific_monthly_savings_usd", cc.get("stack_specific_economics", {}).get("stack_specific_monthly_savings_usd", 0.0))
            wf("cost_per_merged_pr_usd", cc.get("unit_economics_and_chargeback", {}).get("cost_per_merged_pr_usd", 0.0))
            wf("projected_eom_compute_usd", cc.get("spend_anomaly_and_forecast", {}).get("projected_eom_compute_usd", 0.0))
            ws("jobs_missing_timeout_minutes_count", cc.get("spend_anomaly_and_forecast", {}).get("jobs_missing_timeout_minutes_count", 0))
        '
        fi
