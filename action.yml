name: "MiniCI — Infracost for CI/CD (PR Cost Diff & Quota Receipt)"
description: "Sub-millisecond Rust engine that expands CI workflow matrices and posts PR cost diffs, free-tier quota burn %, and dev wait-time cost."
author: "Aamir Raza <raza.aamir01@gmail.com>"
branding:
  icon: "dollar-sign"
  color: "green"

inputs:
  path:
    description: "Path to repository root or workflow directory"
    required: false
    default: "."
  tier:
    description: "Pricing tier mode: auto, free, or paid"
    required: false
    default: "auto"
  prs-per-week:
    description: "Pull requests per week for monthly run-rate projection"
    required: false
    default: "25"
  pushes-per-pr:
    description: "Average pushes per pull request"
    required: false
    default: "4"
  dev-hourly-rate:
    description: "Developer hourly engineering rate (USD) for wait-time cost calculation"
    required: false
    default: "65"

runs:
  using: "composite"
  steps:
    - name: Run MiniCI Sub-Millisecond Rust CI/CD Cost Breakdown & PR Diff
      id: minici
      shell: bash
      run: |
        BIN_PATH="${{ github.action_path }}/target/release/minici"
        if ! "$BIN_PATH" --version >/dev/null 2>&1; then
          cargo build --release --manifest-path "${{ github.action_path }}/crates/minici/Cargo.toml"
          mkdir -p "${{ github.action_path }}/target/release"
          cp "${{ github.action_path }}/crates/minici/target/release/minici" "$BIN_PATH"
        fi
        "$BIN_PATH" breakdown           --path "${{ inputs.path }}"           --tier "${{ inputs.tier }}"           --prs-per-week "${{ inputs.prs-per-week }}"           --pushes-per-pr "${{ inputs.pushes-per-pr }}"           --dev-hourly-rate "${{ inputs.dev-hourly-rate }}"           --format markdown           --out-file .minici_breakdown.md
        cat .minici_breakdown.md
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          cat .minici_breakdown.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
        fi
