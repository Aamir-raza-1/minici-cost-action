name: "MiniCI — Infracost for CI/CD (PR Cost Diff & Quota Receipt)"
description: "Sub-millisecond Rust engine that expands CI workflow matrices and posts PR cost diffs, free-tier quota burn %, and dev wait-time cost."
author: "Aamir Raza <raza.aamir01@gmail.com>"
branding:
  icon: "dollar-sign"
  color: "green"

inputs:
  path:
    description: "Path to repository root or workflow directory"
    required: false
    default: "."
  tier:
    description: "Pricing tier mode: auto, free, or paid"
    required: false
    default: "auto"
  prs-per-week:
    description: "Pull requests per week for monthly run-rate projection"
    required: false
    default: "25"
  pushes-per-pr:
    description: "Average pushes per pull request"
    required: false
    default: "4"
  dev-hourly-rate:
    description: "Developer hourly engineering rate (USD) for wait-time cost calculation"
    required: false
    default: "65"

outputs:
  gross_monthly_compute_cost_usd:
    description: "Gross monthly CI/CD compute cost (USD)"
    value: ${{ steps.minici.outputs.gross_monthly_compute_cost_usd }}
  net_billed_monthly_compute_cost_usd:
    description: "Net billed monthly CI/CD compute cost after free-tier allowance (USD)"
    value: ${{ steps.minici.outputs.net_billed_monthly_compute_cost_usd }}
  monthly_rounding_tax_usd:
    description: "Monthly sub-minute ceiling rounding overhead (USD)"
    value: ${{ steps.minici.outputs.monthly_rounding_tax_usd }}
  recommended_ec2_instance:
    description: "Right-sized self-hosted cloud compute instance equivalent"
    value: ${{ steps.minici.outputs.recommended_ec2_instance }}
  artifact_storage_90d_usd:
    description: "Monthly 90-day artifact storage cost (USD)"
    value: ${{ steps.minici.outputs.artifact_storage_90d_usd }}
  parallelism_tier_upgrade_tax_usd:
    description: "Monthly concurrency cap seat-tier upgrade tax (USD)"
    value: ${{ steps.minici.outputs.parallelism_tier_upgrade_tax_usd }}
  datadog_90d_log_shipping_usd:
    description: "Monthly 90-day external log shipping benchmark cost (USD)"
    value: ${{ steps.minici.outputs.datadog_90d_log_shipping_usd }}
  nat_egress_worst_case_usd:
    description: "Monthly private-subnet NAT Gateway + Internet Egress benchmark cost (USD)"
    value: ${{ steps.minici.outputs.nat_egress_worst_case_usd }}
  monthly_productive_payroll_loss_usd:
    description: "Monthly developer wait-time payroll loss at 40% context-switch loss factor (USD)"
    value: ${{ steps.minici.outputs.monthly_productive_payroll_loss_usd }}
  monthly_total_immediate_flake_cost_usd:
    description: "Monthly immediate flaky build rerun compute + 8-minute engineer investigation cost (USD)"
    value: ${{ steps.minici.outputs.monthly_total_immediate_flake_cost_usd }}
  monthly_unrealized_cache_savings_usd:
    description: "Monthly unrealized dependency and build cache savings across uncached jobs (USD)"
    value: ${{ steps.minici.outputs.monthly_unrealized_cache_savings_usd }}
  monthly_combined_flake_tax_usd:
    description: "Monthly combined flaky test velocity tax including 2x deferred velocity drag (USD)"
    value: ${{ steps.minici.outputs.monthly_combined_flake_tax_usd }}
  monthly_superseded_run_waste_usd:
    description: "Monthly superseded PR push compute waste from workflows missing cancel-in-progress (USD)"
    value: ${{ steps.minici.outputs.monthly_superseded_run_waste_usd }}
  monthly_unfiltered_check_savings_usd:
    description: "Monthly selective check savings from workflows missing path filters (USD)"
    value: ${{ steps.minici.outputs.monthly_unfiltered_check_savings_usd }}

runs:
  using: "composite"
  steps:
    - name: Run MiniCI Sub-Millisecond Rust CI/CD Cost Breakdown & PR Diff
      id: minici
      shell: bash
      run: |
        BIN_PATH="${{ github.action_path }}/target/release/minici"
        if ! "$BIN_PATH" --version >/dev/null 2>&1; then
          cargo build --release --manifest-path "${{ github.action_path }}/crates/minici/Cargo.toml"
          mkdir -p "${{ github.action_path }}/target/release"
          cp "${{ github.action_path }}/crates/minici/target/release/minici" "$BIN_PATH"
        fi
        "$BIN_PATH" breakdown \
          --path "${{ inputs.path }}" \
          --tier "${{ inputs.tier }}" \
          --prs-per-week "${{ inputs.prs-per-week }}" \
          --pushes-per-pr "${{ inputs.pushes-per-pr }}" \
          --dev-hourly-rate "${{ inputs.dev-hourly-rate }}" \
          --format table
        "$BIN_PATH" breakdown \
          --path "${{ inputs.path }}" \
          --tier "${{ inputs.tier }}" \
          --prs-per-week "${{ inputs.prs-per-week }}" \
          --pushes-per-pr "${{ inputs.pushes-per-pr }}" \
          --dev-hourly-rate "${{ inputs.dev-hourly-rate }}" \
          --format markdown \
          --out-file .minici_breakdown.md \
          --quiet
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f .minici_breakdown.md ]; then
          cat .minici_breakdown.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          "$BIN_PATH" breakdown \
            --path "${{ inputs.path }}" \
            --tier "${{ inputs.tier }}" \
            --prs-per-week "${{ inputs.prs-per-week }}" \
            --pushes-per-pr "${{ inputs.pushes-per-pr }}" \
            --dev-hourly-rate "${{ inputs.dev-hourly-rate }}" \
            --format json \
            --out-file .minici_breakdown.json \
            --quiet
          python3 -c '
        import json, os
        d = json.load(open(".minici_breakdown.json"))
        cc = d.get("cost_components", {})
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"gross_monthly_compute_cost_usd={d.get(\"gross_monthly_compute_cost_usd\", 0.0):.2f}\n")
            f.write(f"net_billed_monthly_compute_cost_usd={d.get(\"net_billed_monthly_compute_cost_usd\", 0.0):.2f}\n")
            f.write(f"monthly_rounding_tax_usd={cc.get(\"build_minutes_cost\", {}).get(\"monthly_rounding_tax_usd\", 0.0):.2f}\n")
            f.write(f"recommended_ec2_instance={cc.get(\"runner_cost\", {}).get(\"infracost_recommended_ec2_instance\", \"\")}\n")
            f.write(f"artifact_storage_90d_usd={cc.get(\"artifact_storage_cost\", {}).get(\"monthly_vendor_storage_90d_usd\", 0.0):.2f}\n")
            f.write(f"parallelism_tier_upgrade_tax_usd={cc.get(\"parallelism_cost\", {}).get(\"parallelism_tier_upgrade_tax_monthly_usd\", 0.0):.2f}\n")
            f.write(f"datadog_90d_log_shipping_usd={cc.get(\"log_retention_cost\", {}).get(\"monthly_datadog_90d_log_shipping_usd\", 0.0):.2f}\n")
            f.write(f"nat_egress_worst_case_usd={cc.get(\"cross_region_egress_cost\", {}).get(\"monthly_infracost_private_subnet_nat_worst_case_usd\", 0.0):.2f}\n")
            f.write(f"monthly_productive_payroll_loss_usd={cc.get(\"developer_wait_time_cost\", {}).get(\"monthly_productive_payroll_loss_usd\", 0.0):.2f}\n")
            f.write(f"monthly_total_immediate_flake_cost_usd={cc.get(\"failed_build_rerun_cost\", {}).get(\"monthly_total_immediate_flake_cost_usd\", 0.0):.2f}\n")
            f.write(f"monthly_unrealized_cache_savings_usd={cc.get(\"build_cache_savings\", {}).get(\"monthly_unrealized_cache_savings_usd\", 0.0):.2f}\n")
            f.write(f"monthly_combined_flake_tax_usd={cc.get(\"flaky_test_ci_cd_tax\", {}).get(\"monthly_combined_flake_tax_usd\", 0.0):.2f}\n")
            f.write(f"monthly_superseded_run_waste_usd={cc.get(\"branch_protection_cost\", {}).get(\"monthly_superseded_run_waste_usd\", 0.0):.2f}\n")
            f.write(f"monthly_unfiltered_check_savings_usd={cc.get(\"branch_protection_cost\", {}).get(\"monthly_unfiltered_check_savings_usd\", 0.0):.2f}\n")
        '
        fi
