    official_calculator_url: "https://circleci.com/pricing/"
    official_pricing_url: "https://circleci.com/docs/credits/"
    gcosts_github_url: "https://cicdcalculator.com/"
  - provider: "bitbucket"
    plan: "standard"
    sku: "linux_2x"
    label: "Bitbucket Pipelines 2x Step (4 vCPU, 8GB RAM, 2x multiplier)"
    official_calculator_url: "https://www.atlassian.com/software/bitbucket/pricing"
    official_pricing_url: "https://support.atlassian.com/bitbucket-cloud/docs/configure-bitbucket-pipelines-yml/"
