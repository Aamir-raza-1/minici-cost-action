    official_pricing_url: "https://docs.gitlab.com/ee/ci/pipelines/cicd_minutes.html"
    gcosts_github_url: "https://cicdcost.com/"
  - provider: "circleci"
    plan: "performance"
    sku: "linux_x64_large"
